name: Update gallery data

on:
  push:
    paths:
      - "photos/**"
      - "scripts/generate-gallery-data.mjs"
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate gallery data
        run: node scripts/generate-gallery-data.mjs

      - name: Commit updated gallery data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery-data.js photos
          git diff --cached --quiet && exit 0
          git commit -m "Update gallery data"
          git push
