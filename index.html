<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>☁Derkey☁</title>

  <style>
    :root {
      --blue: #1b6e9b;
      --blue-dark: #0a5d9a;
      --cyan: #8fe9ff;
      --glass: rgba(255, 255, 255, 0.28);
      --glass-strong: rgba(123, 181, 218, 0.52);
      --line: rgba(235, 250, 255, 0.74);
      --shadow: rgba(15, 72, 112, 0.22);
      --ease-slide: cubic-bezier(0.38, 0, 0.16, 1);
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --hand-font: "Comic Sans MS", "Segoe Print", cursive;
      --ui-font: "Segoe UI", Tahoma, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: #2f8ab3;
      color: var(--blue);
      font-family: var(--ui-font);
    }

    body {
      min-height: 100dvh;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    .spotify-link:focus-visible,
    .sky-frame:focus-visible {
      outline: 3px solid rgba(239, 252, 255, 0.96);
      outline-offset: 4px;
    }

    /* App shell */
    .page {
      position: relative;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: max(28px, env(safe-area-inset-top)) 22px max(34px, env(safe-area-inset-bottom));
      isolation: isolate;
      background:
        linear-gradient(rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.04)),
        url("background.jpg") center / cover no-repeat;
    }

    .cover,
    .sky-day {
      grid-area: 1 / 1;
      width: 100%;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      transition:
        opacity 520ms ease,
        transform 720ms cubic-bezier(0.48, 0.02, 0.16, 1),
        filter 520ms ease;
    }

    .sky-day {
      opacity: 0;
      pointer-events: none;
      transform: translateY(18px) scale(1.04);
      filter: blur(8px);
      overflow: hidden;
    }

    .day-backdrop {
      position: fixed;
      inset: 0;
      z-index: -1;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      opacity: 0;
      transition: opacity 520ms ease;
      pointer-events: none;
    }

    body.show-day .day-backdrop {
      opacity: 1;
    }

    .day-backdrop img {
      position: absolute;
      inset: -16%;
      width: 132%;
      height: 132%;
      object-fit: cover;
      object-position: center;
      opacity: 0;
      transform: scale(1.18);
      filter: blur(18px) saturate(1.08) brightness(0.98);
      transition: opacity 620ms ease;
    }

    .day-backdrop img.active {
      opacity: 0.74;
    }

    .day-backdrop::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(180, 220, 252, 0.2), rgba(180, 220, 252, 0.2)),
        radial-gradient(circle at 50% 36%, rgba(255, 255, 255, 0.12), transparent 56%);
      backdrop-filter: blur(2px);
    }

    body.show-day .cover {
      opacity: 0;
      pointer-events: none;
      transform: scale(1.18);
      filter: blur(8px);
    }

    body.show-day .sky-day {
      position: fixed;
      inset: 0;
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
      filter: blur(0);
    }

    body.show-day .page {
      background: #7bbaf0;
    }

    /* Shared controls */
    .round-button,
    .day-nav {
      position: relative;
      width: 46px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 2px solid rgba(21, 103, 156, 0.74);
      border-radius: 50%;
      background: var(--glass);
      color: #0c649c;
      backdrop-filter: blur(10px);
      transition: transform 180ms var(--ease-out), background 180ms ease;
    }

    .round-button svg,
    .day-nav svg {
      width: 52%;
      height: 52%;
      fill: none;
      stroke: currentColor;
      stroke-width: 6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .round-button::after,
    .day-nav::after {
      content: "";
      position: absolute;
      inset: -7px;
      border: 2px solid rgba(143, 233, 255, 0.52);
      border-radius: inherit;
      opacity: 0;
      transform: scale(0.78);
      pointer-events: none;
    }

    .round-button:active,
    .day-nav:active {
      transform: scale(1.12);
      background: rgba(226, 249, 255, 0.5);
    }

    .round-button:active::after,
    .day-nav:active::after {
      animation: pulse-ring 420ms ease-out;
    }

    .back-button:active svg,
    .prev-day:active svg {
      animation: nudge-left 260ms ease-out;
    }

    .next-day:active svg {
      animation: nudge-right 260ms ease-out;
    }

    /* Cover profile */
    .profile {
      width: min(100%, 430px);
      min-height: min(760px, calc(100dvh - 58px));
      display: grid;
      grid-template-rows: 1fr auto auto auto 1fr;
      align-items: center;
      justify-items: center;
      gap: 20px;
      transform: translateY(8px);
    }

    .photo-wrap {
      position: relative;
      grid-row: 2;
      width: min(74vw, 318px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
    }

    .photo-ring {
      position: absolute;
      inset: 0;
      border: 2.5px solid var(--blue);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.22);
      box-shadow: 0 18px 42px var(--shadow);
      transform: rotate(-2deg);
      backdrop-filter: blur(7px);
    }

    .photo-ring::before,
    .photo-ring::after {
      content: "";
      position: absolute;
      inset: 11px;
      border: 1.8px solid rgba(27, 110, 155, 0.26);
      border-radius: 50%;
      transform: rotate(7deg);
    }

    .photo-ring::after {
      inset: -12px;
      opacity: 0.42;
      border-style: dashed;
      animation: breathe 5.4s ease-in-out infinite;
    }

    .photo {
      position: relative;
      width: calc(100% - 40px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 50%;
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.82), rgba(197, 232, 242, 0.68));
      box-shadow: inset 0 0 48px rgba(255, 255, 255, 0.48);
      touch-action: none;
    }

    .photo img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: var(--crop-x, 40%) var(--crop-y, 0%);
      user-select: none;
      -webkit-user-drag: none;
    }

    .name {
      grid-row: 3;
      margin: 0;
      color: var(--cyan);
      font-family: var(--hand-font);
      font-size: clamp(2.35rem, 11vw, 4.7rem);
      font-weight: 500;
      line-height: 0.9;
      letter-spacing: 0;
      -webkit-text-stroke: 2.6px var(--blue-dark);
      paint-order: stroke fill;
      text-shadow:
        0 2px 0 rgba(255, 255, 255, 0.42),
        0 0 18px rgba(143, 233, 255, 0.62),
        0 18px 32px rgba(19, 74, 112, 0.24);
      transform: rotate(-1.4deg);
    }

    .play-button {
      grid-row: 4;
      width: clamp(72px, 21vw, 96px);
      aspect-ratio: 1.18;
      display: grid;
      place-items: center;
      border: 2.4px solid var(--blue);
      border-radius: 46% 54% 52% 48% / 54% 45% 55% 46%;
      background: rgba(255, 255, 255, 0.34);
      color: var(--blue);
      box-shadow: 0 14px 28px var(--shadow);
      transform: rotate(-3deg);
      transition: transform 220ms ease, box-shadow 220ms ease, background 220ms ease;
    }

    .play-button svg {
      width: 42%;
      height: 42%;
      margin-left: 5px;
      fill: none;
      stroke: currentColor;
      stroke-width: 8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .play-button:active {
      transform: rotate(-3deg) scale(0.94);
      background: rgba(213, 241, 252, 0.72);
      box-shadow: 0 8px 18px var(--shadow);
    }

    .cover-tagline {
      position: fixed;
      left: 0;
      right: 0;
      bottom: max(8px, env(safe-area-inset-bottom));
      z-index: 2;
      margin: 0;
      color: rgba(238, 250, 255, 0.9);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(0.68rem, 2.5vw, 0.9rem);
      font-style: italic;
      font-weight: 500;
      letter-spacing: 0;
      line-height: 1;
      text-align: center;
      text-shadow:
        0 1px 0 rgba(255, 255, 255, 0.32),
        0 8px 24px rgba(11, 76, 118, 0.42);
    }

    body.show-day .cover-tagline {
      opacity: 0;
      pointer-events: none;
    }

    /* Day gallery */
    .day-card {
      position: relative;
      width: min(100%, 430px);
      min-height: min(760px, calc(100dvh - 24px));
      display: grid;
      grid-template-rows: auto 1fr auto auto;
      gap: 12px;
      padding: max(24px, env(safe-area-inset-top)) 12px max(14px, env(safe-area-inset-bottom));
    }

    .day-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 46px;
    }

    .left-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .date-badge {
      color: #eafaff;
      text-align: right;
      text-shadow: 0 2px 14px rgba(13, 76, 122, 0.5);
    }

    .month-switcher {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
    }

    .month-label {
      min-width: 150px;
      text-align: center;
      font-family: var(--hand-font);
      font-size: clamp(1.55rem, 6.8vw, 2.5rem);
      line-height: 0.92;
      letter-spacing: 0;
      -webkit-text-stroke: 1.4px var(--blue-dark);
      paint-order: stroke fill;
    }

    .month-nav {
      width: 32px;
      height: 40px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      color: #eafaff;
      background: transparent;
      cursor: pointer;
      filter: drop-shadow(0 2px 6px rgba(13, 76, 122, 0.5));
    }

    .month-nav svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .month-nav:disabled {
      opacity: 0.28;
      cursor: default;
    }

    .month-nav:not(:disabled):hover {
      transform: translateY(-1px);
    }

    .month-nav:focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: 2px;
      border-radius: 8px;
    }

    .sky-frame {
      align-self: center;
      justify-self: center;
      position: relative;
      width: min(92vw, 340px);
      min-height: 0;
      margin: 0;
      overflow: hidden;
      border: 3px solid rgba(235, 250, 255, 0.86);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.12);
      box-shadow:
        0 24px 48px rgba(19, 73, 115, 0.18),
        inset 0 0 0 1px rgba(22, 98, 152, 0.1);
      cursor: zoom-in;
    }

    .sky-frame::before {
      content: "";
      position: absolute;
      inset: 12px;
      z-index: 2;
      pointer-events: none;
      border: 1.5px solid rgba(255, 255, 255, 0.42);
      border-radius: 20px;
    }

    .empty-month {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: none;
      place-items: center;
      padding: 28px;
      color: #effbff;
      text-align: center;
      font-family: var(--hand-font);
      font-size: 1.5rem;
      line-height: 1.25;
      text-shadow: 0 2px 12px rgba(13, 76, 122, 0.55);
      background: rgba(78, 149, 202, 0.26);
    }

    .sky-frame.is-empty {
      cursor: default;
    }

    .sky-frame.is-empty .empty-month {
      display: grid;
    }

    .sky-frame.is-empty .sky-photo-track,
    .sky-frame.is-empty .potm-badge {
      visibility: hidden;
    }

    .sky-photo-track {
      position: relative;
      width: 100%;
      height: min(58dvh, 620px);
      min-height: 410px;
    }

    .day-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
      transition: transform 520ms var(--ease-slide), opacity 520ms ease;
      will-change: transform, opacity;
    }

    .day-image-next {
      opacity: 0;
      transform: translateX(100%);
    }

    .potm-badge {
      position: absolute;
      top: clamp(-10px, -1.4vw, -4px);
      right: clamp(-12px, -1.8vw, -5px);
      z-index: 4;
      width: clamp(78px, 18vw, 112px);
      aspect-ratio: 1;
      object-fit: contain;
      opacity: 0;
      pointer-events: none;
      transform: translate(10%, -12%) rotate(9deg) scale(0.82);
      transform-origin: 72% 28%;
      filter: drop-shadow(0 10px 14px rgba(19, 63, 106, 0.22));
      transition: opacity 220ms ease, transform 320ms var(--ease-out);
    }

    .potm-badge.is-active {
      opacity: 1;
      transform: translate(10%, -12%) rotate(9deg) scale(1);
    }

    .caption {
      position: absolute;
      left: 22px;
      right: 22px;
      bottom: 20px;
      z-index: 3;
      padding: 10px 14px;
      border: 1px solid rgba(255, 255, 255, 0.34);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.14);
      color: #f2fcff;
      box-shadow: 0 12px 24px rgba(24, 74, 113, 0.12);
      text-shadow: 0 2px 12px rgba(10, 73, 117, 0.36);
      backdrop-filter: blur(12px);
    }

    .caption strong {
      font-family: var(--hand-font);
      font-size: 1.18rem;
      line-height: 1;
      letter-spacing: 0;
      -webkit-text-stroke: 0.8px var(--blue-dark);
      paint-order: stroke fill;
    }

    .day-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    .day-controls button:disabled {
      opacity: 0.34;
      cursor: default;
      pointer-events: none;
    }

    .slideshow-toggle {
      position: relative;
      min-width: 132px;
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(21, 103, 156, 0.7);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.34);
      color: #0c649c;
      font-weight: 800;
      backdrop-filter: blur(10px);
      overflow: hidden;
      transition: transform 180ms var(--ease-out), background 180ms ease;
    }

    .slideshow-toggle::after {
      content: "";
      position: absolute;
      inset: 50%;
      width: 16px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(143, 233, 255, 0.42);
      opacity: 0;
      transform: translate(-50%, -50%) scale(0);
      pointer-events: none;
    }

    .slideshow-toggle:active {
      transform: scale(0.92);
      background: rgba(226, 249, 255, 0.62);
    }

    .slideshow-toggle:active::after {
      animation: button-ripple 420ms ease-out;
    }

    body.is-slideshow .slideshow-toggle {
      animation: slideshow-glow 1.5s ease-in-out infinite;
    }

    .slideshow-icon {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 8;
      stroke-linejoin: round;
    }

    .icon-pause {
      display: none;
    }

    .is-slideshow .icon-play {
      display: none;
    }

    .is-slideshow .icon-pause {
      display: block;
    }

    .slideshow-progress {
      width: min(92vw, 380px);
      height: 5px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.28);
    }

    .slideshow-progress span {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--cyan), var(--blue));
      transform: scaleX(0);
      transform-origin: left center;
    }

    .spotify-link {
      justify-self: center;
      width: 74px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      margin-top: clamp(16px, 3vh, 30px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 22px;
      background: rgba(18, 15, 15, 0.8);
      box-shadow:
        0 18px 34px rgba(22, 98, 152, 0.24),
        0 0 0 0 rgba(30, 215, 96, 0.34);
      color: #1ed760;
      text-decoration: none;
      backdrop-filter: blur(12px);
      transition: transform 180ms var(--ease-out), box-shadow 220ms ease, background 180ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .spotify-link svg {
      width: 58%;
      height: 58%;
      fill: currentColor;
    }

    .spotify-link:active {
      transform: scale(0.88) rotate(-4deg);
      background: rgba(10, 10, 10, 0.9);
      box-shadow:
        0 10px 22px rgba(22, 98, 152, 0.2),
        0 0 0 14px rgba(30, 215, 96, 0.16);
    }

    .spotify-link:focus-visible {
      outline: 3px solid rgba(30, 215, 96, 0.36);
      outline-offset: 5px;
    }

    .spotify-sheet {
      position: fixed;
      left: max(14px, env(safe-area-inset-left));
      right: max(14px, env(safe-area-inset-right));
      bottom: max(14px, env(safe-area-inset-bottom));
      z-index: 80;
      max-width: 430px;
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 18px;
      background: rgba(24, 24, 24, 0.82);
      box-shadow: 0 28px 72px rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(18px) saturate(1.18);
      opacity: 0;
      pointer-events: none;
      transform: translateY(calc(100% + 18px)) scale(0.96);
      transition: opacity 260ms ease, transform 360ms var(--ease-out);
    }

    body.spotify-open .spotify-sheet {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    .spotify-sheet iframe {
      width: 100%;
      height: min(66dvh, 520px);
      min-height: 420px;
      display: block;
      border: 0;
    }

    /* Music player */
    .music-panel {
      position: absolute;
      top: calc(max(18px, env(safe-area-inset-top)) + 58px);
      left: 12px;
      right: 12px;
      z-index: 30;
      height: 178px;
      overflow: hidden;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(-8px);
      transition:
        opacity 260ms ease,
        transform 360ms var(--ease-out),
        visibility 0s linear 360ms;
    }

    body.music-open .music-panel {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0);
      transition-delay: 0s;
    }

    .music-frame {
      display: grid;
      gap: 12px;
      padding: 13px 14px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 18px;
      background: rgba(33, 150, 243, 0.28);
      box-shadow: 0 22px 42px rgba(18, 96, 160, 0.26);
      backdrop-filter: blur(16px) saturate(1.25);
    }

    .song-info {
      min-width: 0;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
    }

    .song-title,
    .artist-name {
      min-width: 0;
      overflow: hidden;
      color: #f6fbff;
      font-size: 0.92rem;
      font-weight: 750;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .artist-name {
      max-width: 9rem;
      color: rgba(246, 251, 255, 0.82);
      font-size: 0.84rem;
      text-align: right;
    }

    .music-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
    }

    .player-button {
      width: 34px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: rgba(255, 255, 255, 0.72);
      transition: transform 170ms ease, color 170ms ease, background 170ms ease;
    }

    .player-button svg {
      width: 68%;
      height: 68%;
      fill: currentColor;
      stroke: none;
    }

    .player-button:active {
      transform: scale(0.84);
      color: #1ed760;
    }

    .music-stop {
      width: 52px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: #ffffff;
      color: #050b10;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.32);
      transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }

    .music-stop svg {
      width: 50%;
      height: 50%;
      fill: currentColor;
    }

    .music-stop:active {
      transform: scale(0.86);
      background: #dfffea;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.28);
    }

    body.music-playing .play-icon {
      display: none;
    }

    body:not(.music-playing) .pause-icon {
      display: none;
    }

    .track-progress {
      display: grid;
      grid-template-columns: 42px 1fr 42px;
      align-items: center;
      gap: 8px;
      color: rgba(255, 255, 255, 0.9);
      font-size: 0.82rem;
      font-variant-numeric: tabular-nums;
    }

    .track-bar,
    .volume-bar {
      position: relative;
      height: 5px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.25);
    }

    .track-bar span,
    .volume-fill {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      background: #ffffff;
      transform: scaleX(0);
      transform-origin: left center;
      transition: transform 120ms linear;
    }

    .volume-control {
      display: grid;
      grid-template-columns: 24px 1fr 40px;
      align-items: center;
      gap: 10px;
      color: rgba(255, 255, 255, 0.78);
    }

    .volume-slider {
      position: relative;
      width: 100%;
      height: 22px;
      margin: 0;
      opacity: 0;
      cursor: pointer;
      z-index: 2;
    }

    .volume-value {
      min-width: 38px;
      color: rgba(255, 255, 255, 0.86);
      font-size: 0.86rem;
      font-weight: 800;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .volume-wrap {
      position: relative;
      display: grid;
      align-items: center;
    }

    .volume-wrap .volume-bar {
      position: absolute;
      inset-inline: 0;
      top: 50%;
      transform: translateY(-50%);
    }

    .volume-control:has(.volume-slider:active) .volume-fill,
    .volume-control:has(.volume-slider:focus-visible) .volume-fill {
      background: #1ed760;
      box-shadow: 0 0 12px rgba(30, 215, 96, 0.45);
    }

    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(0, 0, 0, 0.88);
      opacity: 0;
      pointer-events: none;
      transition: opacity 280ms ease;
    }

    .lightbox.open {
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox-img {
      max-width: 96vw;
      max-height: 92dvh;
      border-radius: 16px;
      object-fit: contain;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6);
      transform: scale(0.92);
      transition: transform 280ms ease;
    }

    .lightbox.open .lightbox-img {
      transform: scale(1);
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.4);
      color: white;
      font-size: 1.2rem;
    }

    /* Animations */
    .is-diving .photo-wrap,
    .is-diving .name,
    .is-diving .play-button {
      animation: sink 780ms cubic-bezier(0.48, 0.02, 0.16, 1) forwards;
    }

    .is-diving .page {
      animation: paper-sink 780ms cubic-bezier(0.48, 0.02, 0.16, 1) forwards;
    }

    @keyframes breathe {
      50% {
        opacity: 0.2;
        transform: scale(1.035) rotate(9deg);
      }
    }

    @keyframes sink {
      to {
        opacity: 0;
        transform: translateY(16vh) scale(1.38);
        filter: blur(6px);
      }
    }

    @keyframes paper-sink {
      to {
        filter: saturate(1.15) brightness(0.92);
      }
    }

    @keyframes pulse-ring {
      0% {
        opacity: 0.75;
        transform: scale(0.78);
      }

      100% {
        opacity: 0;
        transform: scale(1.35);
      }
    }

    @keyframes button-ripple {
      0% {
        opacity: 0.72;
        transform: translate(-50%, -50%) scale(0);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(12);
      }
    }

    @keyframes slideshow-glow {
      50% {
        box-shadow:
          0 14px 28px rgba(24, 88, 132, 0.15),
          0 0 18px rgba(143, 233, 255, 0.58);
        transform: translateY(-1px);
      }
    }

    @keyframes nudge-left {
      50% {
        transform: translateX(-5px) scale(1.08);
      }
    }

    @keyframes nudge-right {
      50% {
        transform: translateX(5px) scale(1.08);
      }
    }

    @media (min-width: 720px) {
      .profile {
        min-height: min(820px, calc(100dvh - 70px));
      }

      .photo-wrap {
        width: min(46vw, 370px);
      }
    }

    @media (min-width: 900px) and (min-height: 760px) {
      .day-card {
        width: min(100%, 520px);
      }

      .sky-frame {
        width: min(38vw, 410px);
      }

      .sky-photo-track {
        height: min(62dvh, 620px);
      }
    }

    @media (max-height: 680px) {
      .profile {
        gap: 14px;
        transform: translateY(0);
      }

      .photo-wrap {
        width: min(64vw, 252px);
      }

      .play-button {
        width: 70px;
      }

      .sky-photo-track {
        height: 54dvh;
        min-height: 360px;
      }

      .music-frame {
        padding: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>

<body>

  <div class="spotify-sheet" aria-label="Spotify playlist">

      title="For DERKEY Spotify playlist"

  <div class="lightbox" id="lightbox" aria-hidden="true">

      <img class="lightbox-img" src="photos/2026-05/day1.jpg" alt="Day 1 sky photo">
  </div>

  <script src="gallery-data.js"></script>
  <script>
    const app = {
      cropKey: "derkey-profile-crop",
      slideMs: 10000,
      fadeVolume: 10,
      months: window.GALLERY_DATA?.months || [],
      tracks: [
        { title: "ขอให้ฟ้าเป็นใจ", artist: "t_047", src: "music/t_047 - ขอให้ฟ้าเป็นใจ.mp3" },
        { title: "รอสายรุ้ง", artist: "t_047", src: "music/t_047 - รอสายรุ้ง.mp3" },
        { title: "สีของฟ้า", artist: "t_047", src: "music/t_047 - สีของฟ้า.mp3" },
        { title: "สายรุ้งหลงฝนโปรย", artist: "PURPEECH", src: "music/PURPEECH - สายรงหลงฝนโปรย.mp3" }
      ]
    };

    const el = {
      play: document.querySelector(".play-button"),
      back: document.querySelector(".back-button"),
      musicToggle: document.querySelector(".music-toggle"),
      musicFrame: document.querySelector(".music-frame"),
      musicAudio: document.querySelector(".music-audio"),
      musicStop: document.querySelector(".music-stop"),
      musicPrev: document.querySelector(".music-prev-track"),
      musicNext: document.querySelector(".music-next-track"),
      volume: document.querySelector(".volume-slider"),
      volumeFill: document.querySelector(".volume-fill"),
      volumeValue: document.querySelector(".volume-value"),
      trackFill: document.querySelector(".track-fill"),
      songCurrentTime: document.querySelector(".song-current-time"),
      songDuration: document.querySelector(".song-duration"),
      songTitle: document.querySelector(".song-title"),
      artistName: document.querySelector(".artist-name"),
      monthLabel: document.querySelector(".month-label"),
      prevMonth: document.querySelector(".prev-month"),
      nextMonth: document.querySelector(".next-month"),
      gallerySection: document.querySelector(".sky-day"),
      skyFrame: document.querySelector(".sky-frame"),
      emptyMonth: document.querySelector(".empty-month"),
      activeImage: document.querySelector(".day-image-current"),
      standbyImage: document.querySelector(".day-image-next"),
      potmBadge: document.querySelector(".potm-badge"),
      activeBackdrop: document.querySelector(".backdrop-image.active"),
      standbyBackdrop: document.querySelector(".backdrop-image:not(.active)"),
      dayCount: document.querySelector(".day-count"),
      prevDay: document.querySelector(".prev-day"),
      nextDay: document.querySelector(".next-day"),
      slideshowToggle: document.querySelector(".slideshow-toggle"),
      progress: document.querySelector(".slideshow-progress span"),
      photo: document.querySelector(".photo"),
      photoImage: document.querySelector(".photo img"),
      lightbox: document.querySelector("#lightbox"),
      lightboxImage: document.querySelector(".lightbox-img"),
      lightboxClose: document.querySelector(".lightbox-close"),
      spotifyButton: document.querySelector(".spotify-link"),
      spotifySheet: document.querySelector(".spotify-sheet")
    };

    function currentBangkokMonthId() {
      const parts = new Intl.DateTimeFormat("en-CA", {
        year: "numeric",
        month: "2-digit",
        timeZone: "Asia/Bangkok"
      }).formatToParts(new Date());
      const values = Object.fromEntries(parts.map((part) => [part.type, part.value]));
      return `${values.year}-${values.month}`;
    }

    const currentMonthIndex = app.months.findIndex((month) => month.id === currentBangkokMonthId());

    const state = {
      monthIndex: currentMonthIndex >= 0 ? currentMonthIndex : Math.max(0, app.months.length - 1),
      dayIndex: 0,
      trackIndex: 0,
      targetVolume: app.fadeVolume / 100,
      isSliding: false,
      fadeTimer: null,
      slideshowTimer: null,
      progressFrame: null,
      progressStartedAt: 0,
      pausedProgressMs: 0,
      wasSlideshowRunning: false,
      hasStartedMusicOnce: false,
      cropDrag: null,
      crop: JSON.parse(localStorage.getItem(app.cropKey) || "{\"x\":50,\"y\":50}")
    };

    function clamp(value, min = 0, max = 100) {
      return Math.max(min, Math.min(max, value));
    }

    /* Profile crop */
    function applyCrop() {
      el.photoImage.style.setProperty("--crop-x", `${state.crop.x}%`);
      el.photoImage.style.setProperty("--crop-y", `${state.crop.y}%`);
      localStorage.setItem(app.cropKey, JSON.stringify(state.crop));
    }

    function startCropDrag(event) {
      state.cropDrag = {
        x: event.clientX,
        y: event.clientY,
        cropX: state.crop.x,
        cropY: state.crop.y
      };
      el.photo.setPointerCapture(event.pointerId);
    }

    function updateCropDrag(event) {
      if (!state.cropDrag) return;
      const size = Math.max(el.photo.clientWidth, 1);
      state.crop.x = clamp(state.cropDrag.cropX - ((event.clientX - state.cropDrag.x) / size) * 72);
      state.crop.y = clamp(state.cropDrag.cropY - ((event.clientY - state.cropDrag.y) / size) * 72);
      applyCrop();
    }

    function resetCrop() {
      state.crop = { x: 50, y: 50 };
      applyCrop();
    }

    /* Day gallery */
    function currentMonth() {
      return app.months[state.monthIndex];
    }

    function currentPhotos() {
      return currentMonth()?.photos || [];
    }

    function updateMonthControls() {
      const month = currentMonth();
      if (!month) return;
      el.monthLabel.textContent = month.label;
      el.gallerySection.setAttribute("aria-label", `${month.label} sky gallery`);
      el.prevMonth.disabled = state.monthIndex === 0;
      el.nextMonth.disabled = state.monthIndex === app.months.length - 1;
    }

    function updateEmptyState() {
      const isEmpty = currentPhotos().length === 0;
      el.skyFrame.classList.toggle("is-empty", isEmpty);
      el.skyFrame.tabIndex = isEmpty ? -1 : 0;
      el.prevDay.disabled = isEmpty;
      el.nextDay.disabled = isEmpty;
      el.slideshowToggle.disabled = isEmpty;
      el.emptyMonth.textContent = `${currentMonth()?.label || "This month"} has no photos yet`;
      if (isEmpty) {
        stopSlideshow();
        el.dayCount.textContent = "Day 0 / 0";
        el.potmBadge.classList.remove("is-active");
        el.potmBadge.setAttribute("aria-hidden", "true");
      }
    }

    function updateDayText() {
      const month = currentMonth();
      const photos = currentPhotos();
      const displayDay = photos[state.dayIndex]?.day || 1;
      const isPhotoOfTheMonth = displayDay === month?.photoOfTheMonthDay;
      el.dayCount.textContent = `Day ${displayDay} / ${photos.length}`;
      el.potmBadge.classList.toggle("is-active", isPhotoOfTheMonth);
      el.potmBadge.setAttribute("aria-hidden", String(!isPhotoOfTheMonth));
    }

    function setBackdrop(src, instant = false) {
      if (instant) {
        el.activeBackdrop.src = src;
        return;
      }

      el.standbyBackdrop.src = src;
      requestAnimationFrame(() => {
        el.standbyBackdrop.classList.add("active");
        el.activeBackdrop.classList.remove("active");
        const oldActive = el.activeBackdrop;
        el.activeBackdrop = el.standbyBackdrop;
        el.standbyBackdrop = oldActive;
      });
    }

    function preloadImage(src) {
      return new Promise((resolve) => {
        const image = new Image();
        image.onload = resolve;
        image.onerror = resolve;
        image.src = src;
      });
    }

    async function setDay(index, direction = 0) {
      if (state.isSliding) return;

      const photos = currentPhotos();
      if (!photos.length) return;
      const nextIndex = (index + photos.length) % photos.length;
      if (nextIndex === state.dayIndex && direction !== 0) return;

      const { src, day: displayDay } = photos[nextIndex];
      const alt = `${currentMonth().label}, day ${displayDay} sky photo`;

      if (direction === 0) {
        state.dayIndex = nextIndex;
        el.activeImage.src = src;
        el.activeImage.alt = alt;
        el.standbyImage.src = src;
        el.standbyImage.alt = alt;
        setBackdrop(src, true);
        updateDayText();
        return;
      }

      state.isSliding = true;
      await preloadImage(src);
      state.dayIndex = nextIndex;
      setBackdrop(src);
      prepareStandbyImage(src, alt, direction);
      animateImageSwap(direction);
    }

    function prepareStandbyImage(src, alt, direction) {
      el.standbyImage.src = src;
      el.standbyImage.alt = alt;
      el.standbyImage.style.transition = "none";
      el.activeImage.style.transition = "none";
      el.standbyImage.style.opacity = "1";
      el.standbyImage.style.transform = `translateX(${direction * 100}%)`;
      el.activeImage.style.opacity = "1";
      el.activeImage.style.transform = "translateX(0)";
    }

    function animateImageSwap(direction) {
      const oldActive = el.activeImage;
      const newActive = el.standbyImage;
      let isSettled = false;

      const settleSwap = () => {
        if (isSettled) return;
        isSettled = true;
        window.clearTimeout(fallbackTimer);
        newActive.removeEventListener("transitionend", handleTransitionEnd);

        newActive.style.transition = "none";
        oldActive.style.transition = "none";
        newActive.style.opacity = "1";
        newActive.style.transform = "translateX(0)";
        oldActive.style.opacity = "0";
        oldActive.style.transform = `translateX(${-direction * 100}%)`;

        el.activeImage = newActive;
        el.standbyImage = oldActive;
        el.activeImage.classList.add("day-image-current");
        el.activeImage.classList.remove("day-image-next");
        el.standbyImage.classList.add("day-image-next");
        el.standbyImage.classList.remove("day-image-current");

        updateDayText();
        state.isSliding = false;

        oldActive.offsetWidth;
        requestAnimationFrame(() => {
          el.activeImage.style.transition = "";
        });
      };

      const handleTransitionEnd = (event) => {
        if (event.target === newActive && event.propertyName === "transform") settleSwap();
      };

      newActive.addEventListener("transitionend", handleTransitionEnd);
      const fallbackTimer = window.setTimeout(settleSwap, 760);

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          newActive.style.transition = "";
          oldActive.style.transition = "";
          newActive.style.transform = "translateX(0)";
          oldActive.style.transform = `translateX(${-direction * 100}%)`;
        });
      });
    }

    async function setMonth(index) {
      if (state.isSliding || !app.months.length) return;
      const nextIndex = clamp(index, 0, app.months.length - 1);
      if (nextIndex === state.monthIndex) return;

      const wasRunning = Boolean(state.slideshowTimer);
      stopSlideshow();
      state.monthIndex = nextIndex;
      state.dayIndex = 0;
      updateMonthControls();
      updateEmptyState();
      const firstPhoto = currentPhotos()[0];
      if (firstPhoto) {
        await preloadImage(firstPhoto.src);
        await setDay(0);
        if (wasRunning) startSlideshow();
      }
    }

    /* Slideshow */
    function startProgress(resumeMs = 0) {
      state.progressStartedAt = performance.now() - resumeMs;
      cancelAnimationFrame(state.progressFrame);

      const tick = () => {
        const elapsed = performance.now() - state.progressStartedAt;
        const percent = Math.min((elapsed / app.slideMs) * 100, 100);
        el.progress.style.transform = `scaleX(${percent / 100})`;
        if (percent < 100) state.progressFrame = requestAnimationFrame(tick);
      };

      state.progressFrame = requestAnimationFrame(tick);
    }

    function stopProgress() {
      cancelAnimationFrame(state.progressFrame);
      el.progress.style.transform = "scaleX(0)";
    }

    function startSlideshow(resumeMs = 0) {
      document.body.classList.add("is-slideshow");
      window.clearTimeout(state.slideshowTimer);
      startProgress(resumeMs);

      state.slideshowTimer = window.setTimeout(() => {
        setDay(state.dayIndex + 1, 1);
        startSlideshow();
      }, app.slideMs - resumeMs);
    }

    function stopSlideshow() {
      document.body.classList.remove("is-slideshow");
      window.clearTimeout(state.slideshowTimer);
      state.slideshowTimer = null;
      stopProgress();
    }

    function resetSlideshowProgressIfRunning() {
      if (!state.slideshowTimer) return;
      startSlideshow();
    }

    /* Music */
    function setTrack(index) {
      state.trackIndex = (index + app.tracks.length) % app.tracks.length;
      const track = app.tracks[state.trackIndex];
      el.musicAudio.src = track.src;
      el.musicAudio.load();
      el.songTitle.textContent = track.title;
      el.artistName.textContent = track.artist;
      el.trackFill.style.transform = "scaleX(0)";
      el.songCurrentTime.textContent = "0:00";
      el.songTitle.animate(
        [
          { transform: "translateY(4px)", opacity: 0.35 },
          { transform: "translateY(0)", opacity: 1 }
        ],
        { duration: 260, easing: "ease-out" }
      );
    }

    function setVolume(value) {
      state.targetVolume = clamp(value) / 100;
      el.musicAudio.volume = state.targetVolume;
      el.volume.value = Math.round(state.targetVolume * 100);
      el.volumeValue.textContent = `${Math.round(state.targetVolume * 100)}%`;
      el.volumeFill.style.transform = `scaleX(${state.targetVolume})`;
      el.volumeFill.animate(
        [
          { filter: "brightness(1.45)" },
          { filter: "brightness(1)" }
        ],
        { duration: 220, easing: "ease-out" }
      );
    }

    function fadeInMusic() {
      window.clearInterval(state.fadeTimer);
      el.musicAudio.volume = 0;

      const step = Math.max(state.targetVolume / 28, 0.01);
      state.fadeTimer = window.setInterval(() => {
        el.musicAudio.volume = Math.min(state.targetVolume, el.musicAudio.volume + step);
        if (el.musicAudio.volume >= state.targetVolume) window.clearInterval(state.fadeTimer);
      }, 90);
    }

    async function playMusic({ fade = false } = {}) {
      if (!el.musicAudio.src) setTrack(state.trackIndex);
      document.body.classList.add("music-playing");
      el.musicStop.animate(
        [
          { transform: "scale(0.82)" },
          { transform: "scale(1.08)" },
          { transform: "scale(1)" }
        ],
        { duration: 260, easing: "ease-out" }
      );

      try {
        if (fade) el.musicAudio.volume = 0;
        await el.musicAudio.play();
        if (fade) fadeInMusic();
      } catch {
        document.body.classList.remove("music-playing");
      }
    }

    function pauseMusic() {
      window.clearInterval(state.fadeTimer);
      el.musicAudio.pause();
      document.body.classList.remove("music-playing");
      el.musicStop.animate(
        [
          { transform: "scale(1)" },
          { transform: "scale(0.88)" },
          { transform: "scale(1)" }
        ],
        { duration: 220, easing: "ease-out" }
      );
    }

    async function changeTrack(offset) {
      const wasPlaying = !el.musicAudio.paused;
      setTrack(state.trackIndex + offset);
      el.musicFrame.animate(
        [
          { transform: `translateX(${offset > 0 ? 8 : -8}px)`, opacity: 0.78 },
          { transform: "translateX(0)", opacity: 1 }
        ],
        { duration: 260, easing: "ease-out" }
      );
      if (wasPlaying) el.musicAudio.addEventListener("canplay", () => playMusic(), { once: true });
    }

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return "0:00";
      const minutes = Math.floor(seconds / 60);
      const remaining = Math.floor(seconds % 60).toString().padStart(2, "0");
      return `${minutes}:${remaining}`;
    }

    function updateSongProgress() {
      const duration = el.musicAudio.duration || 0;
      const current = el.musicAudio.currentTime || 0;
      const percent = duration ? (current / duration) * 100 : 0;
      el.trackFill.style.transform = `scaleX(${percent / 100})`;
      el.songCurrentTime.textContent = formatTime(current);
      el.songDuration.textContent = formatTime(duration);
    }

    /* Lightbox */
    function openLightbox() {
      if (!currentPhotos().length) return;
      el.lightboxImage.src = el.activeImage.src;
      el.lightboxImage.alt = el.activeImage.alt;
      el.lightbox.classList.add("open");
      el.lightbox.setAttribute("aria-hidden", "false");

      state.wasSlideshowRunning = Boolean(state.slideshowTimer);
      if (state.wasSlideshowRunning) {
        window.clearTimeout(state.slideshowTimer);
        state.slideshowTimer = null;
        cancelAnimationFrame(state.progressFrame);
        state.pausedProgressMs = performance.now() - state.progressStartedAt;
      }
    }

    function closeLightbox() {
      el.lightbox.classList.remove("open");
      el.lightbox.setAttribute("aria-hidden", "true");

      if (state.wasSlideshowRunning) {
        startSlideshow(state.pausedProgressMs);
        state.wasSlideshowRunning = false;
      }
    }

    /* Navigation */
    function enterGallery() {
      document.body.classList.add("is-diving");
      if (!state.hasStartedMusicOnce) {
        state.hasStartedMusicOnce = true;
        setVolume(app.fadeVolume);
        playMusic();
      }

      window.setTimeout(() => {
        document.body.classList.remove("is-diving");
        document.body.classList.add("show-day");
        startSlideshow();
      }, 900);
    }

    function leaveGallery() {
      document.body.classList.remove("show-day", "music-open");
      stopSlideshow();
    }

    /* Events */
    el.play.addEventListener("click", enterGallery);
    el.back.addEventListener("click", leaveGallery);
    el.musicToggle.addEventListener("click", () => document.body.classList.toggle("music-open"));
    el.musicStop.addEventListener("click", () => (el.musicAudio.paused ? playMusic() : pauseMusic()));
    el.musicPrev.addEventListener("click", () => changeTrack(-1));
    el.musicNext.addEventListener("click", () => changeTrack(1));
    el.volume.addEventListener("input", () => setVolume(Number(el.volume.value)));

    el.musicAudio.addEventListener("ended", () => {
      setTrack(state.trackIndex + 1);
      playMusic();
    });

    el.musicAudio.addEventListener("loadedmetadata", updateSongProgress);
    el.musicAudio.addEventListener("timeupdate", updateSongProgress);
    el.prevMonth.addEventListener("click", () => setMonth(state.monthIndex - 1));
    el.nextMonth.addEventListener("click", () => setMonth(state.monthIndex + 1));

    el.prevDay.addEventListener("click", () => {
      stopSlideshow();
      setDay(state.dayIndex - 1, -1);
    });

    el.nextDay.addEventListener("click", () => {
      setDay(state.dayIndex + 1, 1);
      resetSlideshowProgressIfRunning();
    });

    el.slideshowToggle.addEventListener("click", () => {
      state.slideshowTimer ? stopSlideshow() : startSlideshow();
    });

    el.spotifyButton.addEventListener("click", () => {
      document.body.classList.toggle("spotify-open");
    });

    document.querySelector(".sky-frame").addEventListener("click", openLightbox);
    document.querySelector(".sky-frame").addEventListener("keydown", (event) => {
      if (event.key !== "Enter" && event.key !== " ") return;
      event.preventDefault();
      openLightbox();
    });
    el.lightboxClose.addEventListener("click", closeLightbox);
    el.lightbox.addEventListener("click", (event) => {
      if (event.target === el.lightbox) closeLightbox();
    });

    document.addEventListener("click", (event) => {
      if (!document.body.classList.contains("spotify-open")) return;
      if (el.spotifySheet.contains(event.target) || el.spotifyButton.contains(event.target)) return;
      document.body.classList.remove("spotify-open");
    });

    el.photo.addEventListener("pointerdown", startCropDrag);
    el.photo.addEventListener("pointermove", updateCropDrag);
    el.photo.addEventListener("pointerup", () => (state.cropDrag = null));
    el.photo.addEventListener("pointercancel", () => (state.cropDrag = null));
    el.photo.addEventListener("dblclick", resetCrop);

    /* Init */
    applyCrop();
    updateMonthControls();
    updateEmptyState();
    setDay(0);
    setTrack(Math.floor(Math.random() * app.tracks.length));
    setVolume(app.fadeVolume);
  </script>
</body>
</html>
